InTerminator = ";";
OutTerminator = ";";

# Start Set & Hold
# Freezes the current position on detector of stage s as target position for 
# closed loop stabilization. Activation of stage s. Position is stored in non-volatile 
# memory
startSetHold {
    out "SSH\$1";
    in "\0";
    @mismatch { in "\x01"; }
}

# Clear Set & Hold
# Deactivation of stage s. Resets target position to “0” (default) on detector 
# of stage s.
clearSetHold {
    out "CSH\$1";
    in "\0";
    @mismatch { in "\x01"; }
}

# Set Adjust-In
# This command allows to align the laser beam electronically. An offset o is 
# added to the detector signal to shift the target position for the closed loop
# stabilization. -5000 ≤ o ≤ 5000, o = 0 for external adjustment.
# Value is stored in non-volatile memory.
# usage:
#   setAdjustIn(s,a), where s is stage number (1 or 2) and a is axis (x or y)
#
setAdjustIn {
    out "SAI\$1\$2%.2r";
    in "\0";
    @mismatch { in "\x01"; }
}

# Get Adjust-In
# Request for offset value of the Adjust-In function.
getAdjustIn {
    out "GAI\$1\$2";
    in "\0";
    in "%2r";
}

# Set Drive Actuator
# This command allows to drive the piezo actuators directly while the
# stabilization is deactivated. That way the start position of the piezo
# actuators before activating the stabilization can be optimized to achieve a
# faster settling time in stabilised position. -5000 ≤ d ≤ 5000. The values for
# d will be cleared automatically when the concerning stage s is turned on or
# the system is turned off. 
#
# Remark: Setting a drive value will only have a lasting effect if the 
# stabilization on the stage is inactive. In case CEA is used to deactivate the 
# stage s, please wait for at least 600ms before setting a drive value
#
# usage:
#   setDriveActuator(s,a), where s is stage number (1 or 2) and a is axis (x or y)
#
setDriveActuator {
    out "SDA\$1\$2%.2r";
    in "\0";
    @mismatch { in "\x01"; }
}


# Get Drive Actuator
# Gets piezo mirror drive actuator values for both stages and both axes all at 
# once, in the order stage 1 x, stage 1 y, stage 2 x, stage 2 y. 
# this protocol should be called with as arguments the names of the PVs to store 
# the 4 values
getDriveActuator {
    out "GDA";
    in "\0";
    in "%(\$1)2r%(\$2)2r%(\$3)2r%(\$4)2r";
}

# Get Status Flag
# Request for system status information
# Returns unsigned char representing EF A2 A1 OnOff2 OnOff1 Adj2 Adj1 PF
getStatusFlag {
    out "GSF";
    in "\0";
    in "%01r";
}

# Connect a stringout record to this to get
# a generic command interface.
# After processing finishes, the record contains the reply.
debug {
    ExtraInput = Ignore;
    out "%s"; in "%(\$1DebugLine1)39c"; in "%(\$1DebugLine2)39c"; in "%(\$1DebugLine3)39c";
}
