InTerminator = ";";
OutTerminator = ";";

# Start Set & Hold
# Freezes the current position on detector of stage s as target position for 
# closed loop stabilization. Activation of stage s. Position is stored in non-volatile 
# memory
startSetHold {
    out "SSH\$1";
    in "\0";
    @mismatch { in "\x01"; }
}

# Clear Set & Hold
# Deactivation of stage s. Resets target position to “0” (default) on detector 
# of stage s.
clearSetHold {
    out "CSH\$1";
    in "\0";
    @mismatch { in "\x01"; }
}

# Set Adjust-In
# This command allows to align the laser beam electronically. An offset o is 
# added to the detector signal to shift the target position for the closed loop
# stabilization. -5000 ≤ o ≤ 5000, o = 0 for external adjustment.
# Value is stored in non-volatile memory.
setAdjustIn {
    out "SAI\$1\$2%.2r";
    in "\0";
    @mismatch { in "\x01"; }
}

# Get Adjust-In
# Request for offset value of the Adjust-In function.
getAdjustIn {
    out "GAI\$1\$2";
    in "\0";
    in "%2r";
}

# Get Drive Actuator
# Gets piezo mirror drive actuator values for both stages and both axes all at 
# once, in the order stage 1 x, stage 1 y, stage 2 x, stage 2 y. 
# this protocol should be called with as arguments the names of the PVs to store 
# the 4 values
getDriveActuator {
    out "GDA";
    in "\0";
    in "%(\$1)2r%(\$2)2r%(\$3)2r%(\$4)2r";
}

# Get Status Flag
# Request for system status information
# Returns unsigned char representing EF A2 A1 OnOff2 OnOff1 Adj2 Adj1 PF
getStatusFlag {
    out "GSF";
    in "\0";
    in "%01r";
}

# Connect a stringout record to this to get
# a generic command interface.
# After processing finishes, the record contains the reply.
debug {
    ExtraInput = Ignore;
    out "%s"; in "%(\$1DebugLine1)39c"; in "%(\$1DebugLine2)39c"; in "%(\$1DebugLine3)39c";
}
