InTerminator = ";";
OutTerminator = ";";

# Start Set & Hold
# Freezes the current position on detector of stage s as target position for 
# closed loop stabilization. Activation of stage s. Position is stored in non-volatile 
# memory
startSetHold {
    out "SSH\$1";
    in "0";
    @mismatch { in "1"; }
}

# Clear Set & Hold
# Deactivation of stage s. Resets target position to “0” (default) on detector 
# of stage s.
clearSetHold {
    out "CSH\$1";
    in "0";
    @mismatch { in "1"; }
}

# Get Status Flag
# Request for system status information
# Returns unsigned char representing EF A2 A1 OnOff2 OnOff1 Adj2 Adj1 PF
getStatusFlag {
    out "GSF";
    in "0";
    in "%d";  
}

# Connect a stringout record to this to get
# a generic command interface.
# After processing finishes, the record contains the reply.
debug {
    ExtraInput = Ignore;
    out "%s"; in "%(DebugLine1)39c"; in "%(DebugLine2)39c"; in "%(DebugLine3)39c"; 
}
